[versions]
# AGP 9.2.0 - the current stable release of the new Android KMP library plugin.
# Requires Gradle >= 9.1.0 and JDK >= 17 (we use JDK 21 toolchain).
agp = "9.2.1"
android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"

# Kotlin 2.3.21 - required for the AGP 9.x Built-in Kotlin support and Compose
# Multiplatform 1.11.x. Compose compiler ships as a Kotlin plugin (no separate
# version needed here).
kotlin = "2.3.21"

# Compose Multiplatform 1.11.x is the first family fully compatible with
# Kotlin 2.3.x and AGP 9.x.
composeMultiplatform = "1.11.0"
# Material3 for CMP 1.11.x — alpha is the only available release for this version.
material3 = "1.11.0-alpha07"

# AndroidX
androidx-activity = "1.13.0"
androidx-core = "1.16.0"
androidx-documentfile = "1.1.0"
androidx-lifecycle = "2.10.0"
androidx-work = "2.11.2"

# Coroutines / serialization / datetime (shared module dependencies).
kotlinxCoroutines = "1.9.0"
kotlinxSerialization = "1.10.0"
kotlinxDatetime = "0.8.0"

# Networking - Ktor 3.x is the first major version with full KMP iOS-arm64 support
# on Kotlin 2.3.
ktor = "3.5.0"

# Persistence
sqldelight = "2.3.2"

# Dependency injection
koin = "4.2.1"

# Logging
napier = "2.7.1"

# atomicfu - lock-free primitives for Kotlin/Native (iOS TLS sidecar uses
# this is to coordinate two nw_connection state-change callbacks).
atomicfu = "0.27.0"

# Navigation (Compose Multiplatform-aware)
voyager = "1.1.0-beta03"

# Test
junit = "4.13.2"

# BouncyCastle - used on Android to mint a self-signed X.509 from the
# AndroidKeyStore-resident EC key pair. iOS uses Security.framework directly via cinterop,
# so this is androidMain-only.
bouncycastle = "1.78.1"

[libraries]
# ---- Kotlin test ----
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

# ---- AndroidX ----
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }

# ---- Compose Multiplatform ----
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# ---- Kotlinx ----
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

# ---- Ktor Client ----
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# ---- Ktor Server ----
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-contentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-statusPages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }

# ---- SQLDelight ----
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutinesExtensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-androidDriver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-nativeDriver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }

# ---- Koin ----
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-composeViewModel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# ---- Logging ----
napier = { module = "io.github.aakira:napier", version.ref = "napier" }

# --- Concurrency primitives ---
kotlinx-atomicfu = {module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu"}

bouncycastle-bcpkix = {module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle"}

# ---- Navigation ----
voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-tabNavigator = { module = "cafe.adriel.voyager:voyager-tab-navigator", version.ref = "voyager" }
voyager-koin = { module = "cafe.adriel.voyager:voyager-koin", version.ref = "voyager" }

[plugins]
# Android application plugin - used by the thin androidApp entry-point module.
# With AGP 9 it ships Built-in Kotlin, so no `kotlin("android")` is needed.
androidApplication = { id = "com.android.application", version.ref = "agp" }

# Android KMP library plugin - replaces the legacy `com.android.library` for
# any module that also applies `org.jetbrains.kotlin.multiplatform`.
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

# Kotlin Multiplatform
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Compose Multiplatform
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# SQLDelight
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }